services:
  postgres:
    image: postgres:15-alpine
    environment: {POSTGRES_USER: mebel48, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set password}', POSTGRES_DB: mebel48}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U mebel48'], interval: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment: {MINIO_ROOT_USER: '${S3_ACCESS_KEY:?set key}', MINIO_ROOT_PASSWORD: '${S3_SECRET_KEY:?set secret}'}
    volumes: [miniodata:/data]
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    depends_on: [postgres,redis,minio]
    restart: unless-stopped
  bot:
    build: .
    command: node apps/bot/src/bot.js
    env_file: .env
    depends_on: [postgres,redis]
    restart: unless-stopped
  worker:
    build: .
    command: node apps/worker/src/worker.js
    env_file: .env
    depends_on: [postgres,redis]
    restart: unless-stopped
  admin:
    build: {context: ., dockerfile: deploy/static.Dockerfile, args: {TARGET: admin, VITE_API_URL: 'https://api.mebel48.uz'}}
    restart: unless-stopped
  miniapp:
    build: {context: ., dockerfile: deploy/static.Dockerfile, args: {TARGET: miniapp, VITE_API_URL: 'https://api.mebel48.uz'}}
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    volumes: ['./deploy/nginx.conf:/etc/nginx/nginx.conf:ro','./deploy/certbot:/var/www/certbot:ro','./deploy/letsencrypt:/etc/letsencrypt:ro']
    ports: ['80:80','443:443']
    depends_on: [api,bot,admin,miniapp]
    restart: unless-stopped
volumes: {pgdata: {}, redisdata: {}, miniodata: {}}
