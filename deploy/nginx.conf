events { worker_connections 1024; }
http {
 server { listen 80; server_name api.mebel48.uz admin.mebel48.uz app.mebel48.uz files.mebel48.uz; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://$host$request_uri; } }
 server { listen 443 ssl; server_name api.mebel48.uz; ssl_certificate /etc/letsencrypt/live/api.mebel48.uz/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/api.mebel48.uz/privkey.pem; client_max_body_size 2m; location / { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; } location /telegram/webhook { proxy_pass http://bot:3001; proxy_set_header Host $host; } }
 server { listen 443 ssl; server_name admin.mebel48.uz; ssl_certificate /etc/letsencrypt/live/admin.mebel48.uz/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/admin.mebel48.uz/privkey.pem; location / { proxy_pass http://admin:80; } }
 server { listen 443 ssl; server_name app.mebel48.uz; ssl_certificate /etc/letsencrypt/live/app.mebel48.uz/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/app.mebel48.uz/privkey.pem; location / { proxy_pass http://miniapp:80; } }
 server {
  listen 443 ssl; server_name files.mebel48.uz;
  ssl_certificate /etc/letsencrypt/live/files.mebel48.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/files.mebel48.uz/privkey.pem;
  client_max_body_size 20m;
  location ^~ /mebel48/orders/ {
   limit_except GET PUT OPTIONS { deny all; }
   if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin https://app.mebel48.uz;
    add_header Access-Control-Allow-Methods 'GET,PUT,OPTIONS';
    add_header Access-Control-Allow-Headers 'Content-Type';
    return 204;
   }
   add_header Access-Control-Allow-Origin https://app.mebel48.uz always;
   proxy_pass http://minio:9000;
   proxy_set_header Host $host;
  }
  location / { return 404; }
 }
}
